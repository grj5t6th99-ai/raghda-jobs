<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Raghda — Management System</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Public+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#F3F2EE;--panel:#fff;--ink:#1B1F2A;--ink2:#5B6170;--line:#DDDCD6;--accent:#D8116A;--brand2:#48A818;--green:#1F7A45;--amber:#B8860B;--blue:#2C5F9E;--side:#1B1F2A}
*{box-sizing:border-box}
body{margin:0;font-family:'Public Sans',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
body[dir=rtl]{font-family:'Noto Kufi Arabic','Public Sans',sans-serif}
h1,h2,h3{font-family:'Oswald','Trebuchet MS',sans-serif;margin:0;font-weight:600}
body[dir=rtl] h1,body[dir=rtl] h2,body[dir=rtl] h3{font-family:'Noto Kufi Arabic',sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-family:'Oswald',sans-serif;font-size:20px}
.logo i{width:14px;height:14px;background:var(--accent);border-radius:3px;display:inline-block}
.navbtn{background:none;border:0;color:#fff;opacity:.75;text-align:start;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.navbtn:hover{opacity:1;background:#ffffff14}
.navbtn.active{opacity:1;background:var(--accent)}
.navbtn .badge{background:#ffffff33;border-radius:999px;padding:1px 8px;font-size:12px}
aside .spacer{flex:1}
.langbtn{border:1px solid #ffffff55;background:none;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit}
main{padding:22px 28px;display:grid;gap:18px;align-content:start}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:28px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:#e9e8e3;color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;border-inline-start:5px solid var(--accent)}
.kpi .v{font-family:'Oswald',sans-serif;font-size:32px;line-height:1}
.kpi .l{color:var(--ink2);font-size:13px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:20px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--ink2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
body[dir=rtl] th{letter-spacing:0}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#faf9f5}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#e9e8e3}
.tag.new{background:#E3ECF7;color:var(--blue)}.tag.quoted,.tag.sent{background:#FBEFD2;color:#7A5300}.tag.won,.tag.approved,.tag.paid,.tag.delivered,.tag.closed{background:#DCEFE2;color:var(--green)}.tag.lost,.tag.rejected,.tag.overdue{background:#F9DCDA;color:var(--accent)}.tag.draft{background:#eee;color:#555}tr.sel td{background:#FBEFD2}.tag.credited{background:#eee;color:#555;text-decoration:line-through}.sharebar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sharebar .hint{font-size:12px;color:#777;flex-basis:100%}.tag.partial{background:#FBEFD2;color:#7A5300}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px}
.modal-bg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:min(880px,100%);max-height:92vh;overflow:auto;display:grid;gap:14px}
.modal h2{font-size:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{margin-inline-start:auto}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px;overflow-x:auto}
.col{background:#EAE9E4;border-radius:12px;padding:10px;min-height:300px;display:grid;gap:8px;align-content:start}
.col h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:4px 6px;display:flex;justify-content:space-between}
.card{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid var(--line);cursor:pointer;display:grid;gap:4px;font-size:13px}
.card b{font-size:14px}
.card .m{color:var(--ink2)}
.card.late{border-inline-start:4px solid var(--accent)}
.lines td input,.lines td select{padding:6px 8px;font-size:13px}
.tot{display:grid;gap:4px;justify-items:end;font-size:15px}
.tot .big{font-family:'Oswald',sans-serif;font-size:26px}
.muted{color:var(--ink2);font-size:13px}
.searchbox{width:260px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.app{align-content:start}#nav{display:flex;gap:4px;overflow-x:auto;flex:1 1 100%;min-width:0;max-width:100%;padding-bottom:2px;order:3}aside{max-width:100vw;overflow:hidden}main{min-width:0;max-width:100vw}.panel td,.panel th{white-space:nowrap}.logo{white-space:nowrap}#nav .navbtn{white-space:nowrap;padding:7px 10px;font-size:14px}aside{gap:6px;padding:8px 12px;align-items:center}.logo{width:auto;padding:4px 4px;font-size:18px;flex:1}aside .row{order:2;gap:4px}aside .langbtn{padding:4px 10px;font-size:13px}aside .spacer,aside .userbox,aside .syncstat{display:none}aside .row{flex:0 0 auto}.panel{overflow-x:auto}.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.kpi .v{font-size:20px}.topbar h1{font-size:22px}.modal{padding:14px;border-radius:10px}.kanban{grid-template-columns:repeat(6,minmax(220px,1fr))}.sharebar{position:sticky;top:0;z-index:5}.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.logo{width:100%}.two{grid-template-columns:1fr}main{padding:14px}}
@media print{aside,.topbar,.noprint{display:none!important}.app{display:block}main{padding:0}.panel{border:0}@page{margin:12mm}}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px;max-width:900px}
.dochead{display:flex;justify-content:space-between;gap:20px;padding:22px 28px;border-bottom:6px solid var(--accent);border-image:linear-gradient(90deg,var(--accent) 0 70%,var(--brand2) 70% 100%) 1;background:#0B0B0D;color:#fff}
.dochead .co{display:flex;gap:14px;align-items:center}.dochead img{height:84px;max-width:180px;object-fit:contain;border-radius:8px}.dochead img.custom{background:#fff;padding:4px;height:64px}
.dochead h2{font-size:24px;color:#fff}.dochead .ar{font-family:'Noto Kufi Arabic',sans-serif;font-size:16px;color:#E0322B}.dochead .meta{font-size:12px;color:#ffffffaa;margin-top:4px}
.doctitle{text-align:end}.doctitle h2{font-size:28px;letter-spacing:.06em;color:#fff}.doctitle .ar{font-size:18px}.doctitle .ref{font-size:15px;margin-top:6px}
.docbody{padding:22px 28px;display:grid;gap:18px}
.docparty{display:grid;grid-template-columns:1fr 1fr;gap:16px}.docparty>div{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.doclabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}.doclabel .ar{font-family:'Noto Kufi Arabic',sans-serif;letter-spacing:0;text-transform:none;margin-inline-start:6px}
.doc table th{background:#F3F2EE;color:var(--ink);font-size:12px}.doc table th .ar{display:block;font-family:'Noto Kufi Arabic',sans-serif;font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--ink2)}
.doc .tot{border-top:2px solid var(--ink);padding-top:10px}
.doc .tot .ar,.doc td .ar,.doc .muted .ar{font-family:'Noto Kufi Arabic',sans-serif;color:var(--ink2);font-size:.8em;margin-inline:8px}
.docfoot{padding:16px 28px;background:#F3F2EE;font-size:12px;color:var(--ink2);display:grid;gap:6px}
.sigs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:20px}.sigs div{border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--ink2)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.photos div{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--ink2);font-size:12px}
.tag.received{background:#DCEFE2;color:var(--green)}.tag.ordered{background:#E3ECF7;color:var(--blue)}
.doc{font-family:'Public Sans',sans-serif;display:grid;gap:14px}
.doc .head{display:flex;justify-content:space-between;border-bottom:3px solid var(--accent);padding-bottom:10px}
.doc h2{font-family:'Oswald',sans-serif;font-size:30px}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
#gate{display:none;min-height:100vh;place-items:center;background:var(--side);padding:20px}
.gatebox{background:#fff;border-radius:16px;padding:28px;width:min(420px,100%);display:grid;gap:12px}
.gatebox h2{font-size:24px}.gatebox .logo{color:var(--ink)!important;font-size:22px}.gate-msg{background:#FBEFD2;color:#7A5300;padding:8px 10px;border-radius:8px;font-size:14px}
.syncstat{font-size:12px;color:#ffffff88;margin:6px 4px 0}.syncstat.error{color:#FFB4A8}.syncstat.saving{color:#FFE9A8}
.userbox{display:grid;gap:4px;padding:8px 4px;border-top:1px solid #ffffff22;font-size:13px;color:#ffffffcc}.userbox b{color:#fff}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
</head>
<body>
<div id="gate"></div>
<div class="app" style="display:none">
<aside>
  <div class="logo"><img src="logo-transparent.png" alt="" style="height:44px;width:44px;object-fit:contain"><span data-t="brand">Al Raghda</span></div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <div class="userbox" id="userbox"></div>
  <div class="row"><button class="langbtn" onclick="toggleLang()" id="langbtn">العربية</button><button class="langbtn" onclick="DB.changePassword()" data-t="chpw">Change password</button><button class="langbtn" onclick="DB.logout()" data-t="logout">Sign out</button></div>
  <p class="syncstat" id="syncstat">✓ Saved</p>
</aside>
<main id="main"></main>
</div>
<div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};

// ---------------------------------------------------------------- seed data
let S=DB.blankState();
try{lang=localStorage.getItem('raghda-lang')||'en'}catch(e){}
function persist(){DB.persist()}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
const cust=id=>S.customers.find(c=>c.id===id)||{name:'?',company:''};
const mat=id=>S.materials.find(m=>m.id===id)||{name:'?',rate:0,unit:'piece',machine:''};
function lineTotal(l){const m=mat(l.mat);const area=(m.unit==='sqm')?(l.w*l.h||0):1;return m.rate*area*(l.qty||0)}
function quoteTotals(q){const sub=q.lines.reduce((a,l)=>a+lineTotal(l),0)+(+q.install||0);const disc=sub*(+q.discount||0)/100;const vat=(sub-disc)*(S.settings.vat||0)/100;return {sub,disc,vat,total:sub-disc+vat}}
function jobQuoteTotal(j){if(j.quote){const q=S.quotes.find(x=>x.id===j.quote);if(q)return quoteTotals(q).total}return j.total||0}
function jobCost(j){const mrate=S.machines[j.machine]||0;return (+j.mat||0)+(+j.machineHrs||0)*mrate+(+j.labourHrs||0)*(S.settings.labour||0)}
function invPaid(i){return i.payments.reduce((a,p)=>a+(+p.amount),0)}
function invTotal(i){if(i.total)return i.total;const j=S.jobs.find(x=>x.id===i.job);return j?jobQuoteTotal(j):0}
function invCredit(i){return (i.credits||[]).reduce((a,c)=>a+(+c.amount),0)}
function invBal(i){return invTotal(i)-invPaid(i)-invCredit(i)}
function invStatus(i){const p=invPaid(i),cr=invCredit(i),tt=invTotal(i);if(cr>0&&cr>=tt-0.5&&p<0.5)return 'Credited';return p+cr>=tt-0.5?'Paid':p>0?'Partial':'Unpaid'}

function render(){
 document.body.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;
 document.getElementById('langbtn').textContent=lang==='en'?'العربية':'English';
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 const counts={enquiries:S.enquiries.filter(e=>e.status==='New').length,quotes:S.quotes.filter(q=>q.status==='Sent').length,jobs:S.jobs.filter(j=>!['Delivered','Closed'].includes(j.stage)).length,invoices:S.invoices.filter(i=>invStatus(i)!=='Paid').length,inventory:S.stock.filter(x=>x.qty<=x.reorder).length,bills:S.bills.filter(b=>billBal(b)>0.5).length,purchases:S.pos.filter(x=>x.status!=='Received').length};
 document.getElementById('userbox').innerHTML=DB.staff?`<b>${esc(DB.staff.name)}</b><span>${DB.staff.role} · ${esc(DB.me.email)}</span>`:'';
 const navAllowed=DB.navFor(NAV);if(!navAllowed.find(([k])=>k===view))view='dashboard';
 document.getElementById('nav').innerHTML=navAllowed.map(([k])=>`<button class="navbtn ${view===k?'active':''}" onclick="go('${k}')"><span>${t(k)}</span>${counts[k]?`<span class="badge">${counts[k]}</span>`:''}</button>`).join('');
 document.getElementById('main').innerHTML=VIEWS[view]();
 if(view!=='dashboard'&&document.querySelector('#main table')){const tb=document.querySelector('#main .topbar');if(tb){const b=document.createElement('button');b.className='btn sm ghost';b.textContent='⬇ '+t('export');b.onclick=exportScreen;(tb.querySelector('.row')||tb).appendChild(b)}}
 if(view==='settings'){loadStaffPanel();loadBackupsPanel()}
}

async function loadStaffPanel(){const el=document.getElementById('stafflist');if(!el)return;const r=await DB.client.from('staff').select('*').order('name');if(r.error){el.innerHTML=`<p class="gate-msg">${r.error.message}</p>`;return}
 el.innerHTML=`<table><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('roleL')}</th><th>${t('activeL')}</th></tr>${r.data.map(x=>`<tr><td><input value="${esc(x.name)}" onchange="updStaff('${x.id}',{name:this.value})"></td><td class="muted">${esc(x.email||'')}</td><td><select onchange="updStaff('${x.id}',{role:this.value})">${['owner','accountant','sales','designer','production','installer'].map(ro=>`<option ${x.role===ro?'selected':''}>${ro}</option>`).join('')}</select></td><td><input type="checkbox" ${x.active?'checked':''} onchange="updStaff('${x.id}',{active:this.checked})"></td></tr>`).join('')}</table>
 <div class="row" style="margin-top:12px"><input id="st_e" placeholder="invited user's email" style="width:260px"><input id="st_n" placeholder="${t('name')}" style="width:200px"><select id="st_r" style="width:auto">${['sales','accountant','designer','production','installer','owner'].map(ro=>`<option>${ro}</option>`).join('')}</select><button class="btn sm primary" onclick="addStaff()">+ ${t('staffT')}</button></div>`}
async function loadBackupsPanel(){const el=document.getElementById('backuplist');if(!el)return;const r=await DB.client.from('backups').select('id,at,bytes').order('at',{ascending:false}).limit(15);if(r.error||!r.data||!r.data.length){el.innerHTML=`<p class="muted">${r.error?esc(r.error.message):t('noBackups')}</p>`;return}
 el.innerHTML=`<table><tr><th>#</th><th>${t('date')}</th><th>Size</th><th></th></tr>${r.data.map(b=>`<tr><td>${b.id}</td><td>${new Date(b.at).toLocaleString('en-GB')}</td><td class="muted">${Math.round((b.bytes||0)/1024)} KB</td><td><button class="btn sm ghost" onclick="downloadBackup(${b.id})">${t('download')}</button></td></tr>`).join('')}</table>`}
async function backupNow(){const r=await DB.client.rpc('take_backup');toast(r.error?r.error.message:'✓ #'+r.data);loadBackupsPanel()}
async function downloadBackup(id){const r=await DB.client.from('backups').select('at,data').eq('id',id).maybeSingle();if(r.error||!r.data)return toast(r.error?r.error.message:'?');dl(new Blob([JSON.stringify(r.data.data,null,1)],{type:'application/json'}),`alraghda-server-backup-${r.data.at.slice(0,10)}.json`)}
async function updStaff(id,patch){const r=await DB.client.from('staff').update(patch).eq('id',id);toast(r.error?r.error.message:'✓')}
async function addStaff(){const email=document.getElementById('st_e').value.trim().toLowerCase();const name=document.getElementById('st_n').value.trim();if(!email||!name)return toast('Email and name required');const r=await DB.client.rpc('add_staff_by_email',{p_email:email,p_name:name,p_role:document.getElementById('st_r').value});if(r.error)return toast(r.error.message);if(!r.data)return toast('No invited user with that email — invite them in Supabase first');toast('✓');loadStaffPanel()}

function docShare(party,kind,ref,date,lines){const st=S.settings;return {phone:party.phone,email:party.email,subject:`${st.company} — ${I18N.en[kind]} ${ref}`,text:`${st.company} · ${st.companyAr||''}\n${I18N.en[kind]} / ${I18N.ar[kind]} ${ref} — ${date}\n`+lines.join('\n')+`\n\n${I18N.en.thanks} / ${I18N.ar.thanks}\n${st.phone||''}`}}
const L=(k)=>`${I18N.en[k]}<span class="ar">${I18N.ar[k]}</span>`;
function docHtml(kindKey,ref,date,party,rows,tt,install,foot,opts={}){const st=S.settings;const logo=st.logo?`<img class="custom" src="${st.logo}" alt="logo">`:`<img src="logo.png" alt="Al Raghda">`;
 const head=`<div class="dochead"><div class="co">${logo}<div><h2>${st.company}</h2><div class="ar">${st.companyAr||''}</div><div class="meta">${st.cr} · ${st.address||''} · ${st.phone} · ${st.email||''}</div></div></div><div class="doctitle"><h2>${I18N.en[kindKey]}</h2><div class="ar">${I18N.ar[kindKey]}</div><div class="ref"><b>${ref}</b><br>${date}</div></div></div>`;
 const partyBox=`<div class="docparty"><div><div class="doclabel">${L(opts.partyLabel||'billTo')}</div><b>${party.name||''}</b><br>${party.company&&party.company!=='—'?party.company+'<br>':''}${party.phone||''}${party.email?'<br>'+party.email:''}${party.address?'<br>'+party.address:''}</div><div><div class="doclabel">${L('from')}</div><b>${st.company}</b><br>${st.address||''}<br>${st.phone}<br>${st.email||''}</div></div>`;
 const table=rows?`<table><tr><th style="width:52%">${L('descr')}</th><th>${L('size')}</th><th>${L('qty')}</th><th style="text-align:end">${L('amountH')}</th></tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td style="${i===3?'text-align:end':''}">${x}</td>`).join('')}</tr>`).join('')}${install?`<tr><td>${L('installation')}</td><td></td><td></td><td style="text-align:end">${fmt(install)}</td></tr>`:''}</table>`:'';
 const totals=tt?`<div class="tot"><span>${L('subtotal')}: ${fmt(tt.sub)}</span>${tt.disc?`<span>${L('discount')}: −${fmt(tt.disc)}</span>`:''}${tt.vat?`<span>${L('vat')} ${st.vat}%: ${fmt(tt.vat)}</span>`:''}<span class="big">${L('total')}: ${fmt(tt.total)}</span></div>`:'';
 return `<div class="doc">${head}<div class="docbody">${partyBox}${opts.before||''}${table}${totals}${opts.after||''}${foot?`<p class="muted">${foot}</p>`:''}</div><div class="docfoot">${opts.bank!==false&&st.bank?`<div>${st.bank}</div>`:''}<div>${st.company} · ${st.cr} · ${st.phone} · ${st.email||''}</div></div></div>`}

 if(!confirm(`${t('issueCN')} ${fmt(amt)} — ${i.id}?`))return;S.seq.cn=S.seq.cn||1001;i.credits=i.credits||[];const cn='CN-'+(S.seq.cn++);i.credits.push({cn,date:today(),amount:amt,reason});persist();openInvoice(id);toast(cn)}

 showDoc(docHtml('creditDoc',cn,c.date,cu,[[`${esc(c.reason)} — ${I18N.en.cnNote} / ${I18N.ar.cnNote} ${i.id} (${i.date})`,'',1,fmt(c.amount)]],{sub:+c.amount,disc:0,vat:0,total:+c.amount},0,t('thanks'),{after:`<div class="muted">${L('balance')} ${i.id}: ${fmt(invBal(i))}</div><div class="sigs"><div>${L('preparedBy')}</div><div>Approved by / اعتمده</div><div></div></div>`,bank:false}),
  {phone:cu.phone,email:cu.email,subject:`${S.settings.company} — ${I18N.en.creditDoc} ${cn}`,text:`${S.settings.company}\n${I18N.en.creditDoc} / ${I18N.ar.creditDoc} ${cn} — ${c.date}\n${I18N.en.cnNote}: ${i.id}\n${I18N.en.amountH}: ${fmt(c.amount)}\n${I18N.en.balance}: ${fmt(invBal(i))}\n\n${I18N.en.thanks}\n${I18N.ar.thanks}`})}

 return `<div class="topbar"><h1>${t('inventory')}</h1><div class="row"><select style="width:auto" onchange="invOnlyLow=this.value==='1';render()"><option value="0" ${!invOnlyLow?'selected':''}>${t('allStock')}</option><option value="1" ${invOnlyLow?'selected':''}>${t('onlyLow')}</option></select><button class="btn" onclick="openStockMove('receive')">+ ${t('receive')}</button><button class="btn primary" onclick="openStockItem()">+ ${t('addStock')}</button></div></div>
 <div class="kpis"><div class="kpi"><div class="v">${S.stock.length}</div><div class="l">${t('materials')}</div></div><div class="kpi" style="border-color:${low?'var(--accent)':'var(--green)'}"><div class="v">${low}</div><div class="l">${t('lowStock')}</div></div><div class="kpi" style="border-color:var(--green)"><div class="v">${fmt(val)}</div><div class="l">${t('stockValue')}</div></div></div>
 <div class="panel"><table><tr><th>${t('material')}</th><th>${t('unit')}</th><th>${t('onHand')}</th><th>${t('reorderAt')}</th><th>${t('status')}</th><th>${t('unitCost')}</th><th>${t('stockValue')}</th><th>${t('supplier')}</th><th>${t('actions')}</th></tr>
 ${items.sort((a,b)=>(a.qty-a.reorder)-(b.qty-b.reorder)).map(x=>{const lowX=x.qty<=x.reorder;const pct=Math.min(100,Math.round(x.qty/Math.max(1,x.reorder*2)*100));return `<tr><td><b>${x.name}</b><div style="height:6px;background:#eee;border-radius:3px;margin-top:6px;width:180px"><div style="height:100%;width:${pct}%;background:${lowX?'var(--accent)':'var(--green)'};border-radius:3px"></div></div></td><td>${x.unit}</td><td><b style="font-size:18px">${x.qty}</b></td><td>${x.reorder}</td><td><span class="tag ${lowX?'overdue':'won'}">${lowX?t('low'):t('ok')}</span></td><td>${x.cost}</td><td>${fmt(x.qty*x.cost)}</td><td class="muted">${x.supplier}</td>
 <td class="row"><button class="btn sm green" onclick="openStockMove('receive','${x.id}')">+</button><button class="btn sm" onclick="openStockMove('adjust','${x.id}')">${t('adjust')}</button><button class="btn sm ghost" onclick="openStockItem('${x.id}')">✎</button></td></tr>`}).join('')||`<tr><td colspan=9 class="muted">${t('noData')}</td></tr>`}</table></div>
 <div class="panel"><h2>${t('movements')}</h2><table><tr><th>${t('date')}</th><th>${t('material')}</th><th>${t('type')}</th><th>${t('qtyChange')}</th><th>${t('ref')}</th><th>${t('reason')}</th></tr>
 ${S.movements.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,25).map(v=>`<tr><td class="muted">${v.date}</td><td>${stockItem(v.item).name}</td><td><span class="tag ${v.type==='receive'?'won':v.type==='consume'?'quoted':'draft'}">${t(v.type)}</span></td><td style="color:${v.qty<0?'var(--accent)':'var(--green)'}"><b>${v.qty>0?'+':''}${v.qty}</b></td><td>${v.ref||'—'}</td><td class="muted">${v.note||''}</td></tr>`).join('')}</table></div>`};
function openStockItem(id){const x=id?S.stock.find(y=>y.id===id):{name:'',unit:'sheet',qty:0,reorder:5,cost:0,supplier:''};
 modal(`<h2>${id?x.name:t('addStock')}</h2><div class="grid2"><label>${t('material')}<input id="s_n" value="${esc(x.name)}"></label><label>${t('unit')}<select id="s_u">${['sheet','roll','piece','set','kg','litre','m'].map(u=>`<option ${x.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label>${t('onHand')}<input type="number" id="s_q" value="${x.qty}"></label><label>${t('reorderAt')}<input type="number" id="s_r" value="${x.reorder}"></label><label>${t('unitCost')}<input type="number" step="0.5" id="s_c" value="${x.cost}"></label><label>${t('supplier')}<input id="s_s" value="${esc(x.supplier)}"></label></div>
 <div class="row"><button class="btn primary" onclick="saveStockItem('${id||''}')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button>${id?`<button class="btn ghost right" onclick="S.stock=S.stock.filter(y=>y.id!=='${id}');persist();closeModal();render()">${t('delete')}</button>`:''}</div>`)}
function saveStockItem(id){const v=k=>document.getElementById(k).value;const o={name:v('s_n'),unit:v('s_u'),qty:+v('s_q'),reorder:+v('s_r'),cost:+v('s_c'),supplier:v('s_s')};if(id)Object.assign(S.stock.find(y=>y.id===id),o);else S.stock.push({id:'s'+uid(),...o});persist();closeModal();render();toast('✓')}
function openStockMove(type,itemId,jobId){if(!S.stock.length)return toast(t('noStock'));const isC=type==='consume';
 modal(`<h2>${t(type)}${jobId?' · '+jobId:''}</h2><div class="grid2"><label>${t('material')}<select id="v_i">${S.stock.map(x=>`<option value="${x.id}" ${x.id===itemId?'selected':''}>${x.name} (${x.qty} ${x.unit})</option>`).join('')}</select></label><label>${t('qtyChange')}<input type="number" step="0.5" id="v_q" value="1"></label>${type==='receive'?`<label>${t('ref')}<input id="v_r" value="PO-${S.seq.po}"></label>`:jobId?'':`<label>${t('ref')}<input id="v_r"></label>`}<label>${t('reason')}<input id="v_n"></label></div>
 <p class="muted">${type==='receive'?'Adds to stock on hand.':isC?'Deducts from stock and adds the material cost to the job.':'Positive or negative correction (count, damage, write-off).'}</p>
 <div class="row"><button class="btn primary" onclick="saveStockMove('${type}','${jobId||''}')">${isC?t('consumeBtn'):t('save')}</button><button class="btn" onclick="closeModal();${jobId?`openJob('${jobId}')`:''}">${t('cancel')}</button></div>`)}
function saveStockMove(type,jobId){const item=document.getElementById('v_i').value;let q=+document.getElementById('v_q').value;if(!q)return;if(type==='consume')q=-Math.abs(q);if(type==='receive')q=Math.abs(q);
 const x=S.stock.find(y=>y.id===item);x.qty=Math.max(0,Math.round((x.qty+q)*100)/100);const refEl=document.getElementById('v_r');const ref=jobId||(refEl?refEl.value:'');
 S.movements.push({id:'v'+uid(),date:today(),item,type,qty:q,ref,note:document.getElementById('v_n').value});if(type==='receive'){S.seq.po++;const sp=S.suppliers.find(y=>y.name===x.supplier)||S.suppliers[0];if(sp)S.bills.push({id:'BILL-'+(S.seq.bill++),date:today(),due:addDays(today(),30),supplier:sp.id,ref,lines:[{acct:'1200',desc:`${q} ${x.unit} ${x.name}`,amount:Math.round(q*x.cost*100)/100}],vat:0,payments:[]})}
 if(jobId){const j=S.jobs.find(y=>y.id===jobId);j.mat=Math.round(((+j.mat||0)+Math.abs(q)*x.cost)*100)/100}persist();closeModal();toast('✓');if(jobId)openJob(jobId);else render()}


// ---------------------------------------------------------------- accounting engine (ledger derived from documents; manual entries stored)
const acct=c=>S.accounts.find(a=>a.code===c)||{code:c,name:'?',type:'asset'};
const SALES_ACCT={Laser:'4020',CNC:'4000','UV printer':'4010','Digital print':'4010'};
const payAcct=m=>m==='cash'?'1000':'1010';
const billPaid=b=>b.payments.reduce((a,p)=>a+ +p.amount,0);const billTotal=b=>b.lines.reduce((a,l)=>a+ +l.amount,0)+(+b.vat||0);const billBal=b=>billTotal(b)-billPaid(b);
const supplier=id=>S.suppliers.find(x=>x.id===id)||{name:'?'};
function allJournals(){const J=[];
 J.push({id:'OPEN',date:S.opening.date,ref:'Opening',memo:'Opening balances',lines:S.opening.lines});
 S.invoices.forEach(i=>{const tt=invTotal(i);if(!tt)return;const j=S.jobs.find(x=>x.id===i.job);const q=j&&j.quote?S.quotes.find(x=>x.id===j.quote):null;const vat=q?quoteTotals(q).vat:0;const net=tt-vat;const inst=q?Math.min(+q.install||0,net):0;
  const lines=[{acct:'1100',dr:tt,cr:0},{acct:SALES_ACCT[j?j.machine:'']||'4000',dr:0,cr:net-inst}];if(inst)lines.push({acct:'4040',dr:0,cr:inst});if(vat)lines.push({acct:'2100',dr:0,cr:vat});
  J.push({id:i.id,date:i.date,ref:i.id,memo:`Invoice ${cust(i.cust).company}`,lines,src:'invoice'});

let recSel={book:null,stmt:null},recShowMatched=false;
function bookItems(){return allJournals().filter(j=>j.id!=='OPEN').flatMap(j=>j.lines.filter(l=>l.acct==='1010').map(l=>({jid:j.id,date:j.date,memo:`${j.ref} · ${j.memo}`,amt:(+l.dr||0)-(+l.cr||0)})))}
function parseStatement(text){const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);if(!lines.length)return [];const delim=[',',';','\t','|'].sort((a,b)=>lines[0].split(b).length-lines[0].split(a).length)[0];
 const split=l=>{const out=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===delim&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out};
 let rows=lines.map(split);const h=rows[0].map(x=>x.toLowerCase());const hasH=h.some(x=>/date|desc|narr|detail|partic|amount|debit|credit|balance|memo|remark/.test(x));
 let ci={date:-1,desc:-1,amt:-1,dr:-1,cr:-1,bal:-1};
 if(hasH){h.forEach((x,i)=>{if(ci.date<0&&/date/.test(x))ci.date=i;else if(ci.desc<0&&/desc|narr|detail|partic|memo|remark|transaction/.test(x))ci.desc=i;else if(ci.amt<0&&/^amount|amt/.test(x))ci.amt=i;else if(ci.dr<0&&/debit|withdraw|^dr|money out|paid out/.test(x))ci.dr=i;else if(ci.cr<0&&/credit|deposit|^cr|money in|paid in/.test(x))ci.cr=i;else if(ci.bal<0&&/balance/.test(x))ci.bal=i});rows=rows.slice(1)}
 if(ci.date<0)ci.date=0;if(ci.desc<0)ci.desc=1;if(ci.amt<0&&ci.dr<0&&ci.cr<0)ci.amt=2;
 const num=v=>{if(v==null)return NaN;let x=String(v).replace(/QAR|SAR|AED|USD/gi,'').replace(/[,\s]/g,'');if(/^\(.*\)$/.test(x))x='-'+x.slice(1,-1);x=x.replace(/^−/,'-').replace(/CR$/i,'').replace(/DR$/i,'');return parseFloat(x)};
 const M={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
 const date=v=>{v=String(v||'').trim();let m;if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;if((m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){let y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}if((m=v.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[a-z]*[\s\-,]+(\d{2,4})/))){let y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${String(M[m[2].toLowerCase()]||1).padStart(2,'0')}-${m[1].padStart(2,'0')}`}return null};
 const out=[];rows.forEach(r=>{const d=date(r[ci.date]);if(!d)return;let amt=NaN;if(ci.amt>=0)amt=num(r[ci.amt]);if(isNaN(amt)||ci.amt<0){const dr=ci.dr>=0?num(r[ci.dr]):NaN,cr=ci.cr>=0?num(r[ci.cr]):NaN;amt=(isNaN(cr)?0:Math.abs(cr))-(isNaN(dr)?0:Math.abs(dr))}if(isNaN(amt)||!amt)return;const bal=ci.bal>=0?num(r[ci.bal]):NaN;out.push({date:d,desc:(r[ci.desc]||'').slice(0,160),amt:Math.round(amt*100)/100,bal:isNaN(bal)?null:bal})});return out}
function importStatementText(text){const rows=parseStatement(text);if(!rows.length)return toast(t('noData'));let added=0,dup=0;rows.forEach(r=>{if(S.bankLines.find(x=>x.date===r.date&&x.amt===r.amt&&x.desc===r.desc)){dup++;return}S.bankLines.push({id:'bl'+uid(),...r,match:null});added++});const last=rows[rows.length-1];if(last&&last.bal!=null)S.settings.stmtBal=last.bal;persist();render();toast(`${added} ${t('imported')}${dup?` · ${dup} ${t('dupSkipped')}`:''}`)}
function importStatementFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importStatementText(r.result);r.readAsText(f)}
function autoMatch(){const used=new Set(S.bankLines.filter(l=>l.match).map(l=>l.match));const books=bookItems().filter(b=>!used.has(b.jid));let n=0;S.bankLines.filter(l=>!l.match).sort((a,b)=>a.date<b.date?-1:1).forEach(l=>{let best=null,bd=99;books.forEach(b=>{if(used.has(b.jid)||Math.abs(b.amt-l.amt)>0.5)return;const dd=Math.abs((new Date(b.date)-new Date(l.date))/86400000);if(dd<=7&&dd<bd){bd=dd;best=b}});if(best){l.match=best.jid;used.add(best.jid);n++}});persist();render();toast(`${n} ${t('matched')}`)}
function doMatch(){if(!recSel.book||!recSel.stmt)return;const l=S.bankLines.find(x=>x.id===recSel.stmt);const b=bookItems().find(x=>x.jid===recSel.book);if(!l||!b)return;if(Math.abs(b.amt-l.amt)>0.5&&!confirm(`${fmt(b.amt)} ≠ ${fmt(l.amt)} — match anyway?`))return;l.match=b.jid;recSel={book:null,stmt:null};persist();render()}
function unmatchLine(id){const l=S.bankLines.find(x=>x.id===id);if(l){l.match=null;persist();render()}}
function removeLine(id){if(!confirm('Remove this statement line?'))return;S.bankLines=S.bankLines.filter(x=>x.id!==id);persist();render()}
ACCT.bankrec=()=>{const matchedIds=new Set(S.bankLines.filter(l=>l.match).map(l=>l.match));const books=bookItems().sort((a,b)=>a.date<b.date?1:-1);const ub=books.filter(b=>!matchedIds.has(b.jid));const stmt=S.bankLines.slice().sort((a,b)=>a.date<b.date?1:-1);const us=stmt.filter(l=>!l.match);
 const bookBal=balances(null,today())['1010']||0;const sumB=ub.reduce((a,b)=>a+b.amt,0),sumS=us.reduce((a,l)=>a+l.amt,0);const stmtBal=S.settings.stmtBal;const diff=stmtBal==null?null:stmtBal-(bookBal-sumB+sumS);
 const row=(d,memo,amt,cls,onclick,extra='')=>`<tr class="${cls}" style="cursor:pointer" onclick="${onclick}"><td class="muted" style="white-space:nowrap">${d}</td><td>${esc(memo)}</td><td style="text-align:end;color:${amt<0?'var(--accent)':'var(--green)'}">${amt<0?'−':''}${fmt(Math.abs(amt))}</td>${extra}</tr>`;
 return `<div class="row"><label>${t('importStmt')}<input type="file" accept=".csv,.txt" onchange="importStatementFile(this)"></label><label style="flex:1;min-width:260px">${t('pasteStmt')}<textarea id="st_paste" rows="2" placeholder="2026-11-20, Transfer from Karak Corner, 1500\n21/11/2026, POS Lulu, -230.50"></textarea></label><button class="btn" style="align-self:end" onclick="importStatementText(document.getElementById('st_paste').value)">${t('importBtn')}</button></div>
 <div class="kpis"><div class="kpi" style="border-color:var(--blue)"><div class="v">${fmt(bookBal)}</div><div class="l">${t('bookBal')}</div></div><div class="kpi"><div class="v"><input type="number" value="${stmtBal??''}" placeholder="—" style="width:150px;font-weight:700" onchange="S.settings.stmtBal=this.value===''?null:+this.value;persist();render()"></div><div class="l">${t('stmtBal')}</div></div><div class="kpi" style="border-color:var(--amber)"><div class="v">${fmt(sumB)}</div><div class="l">${t('unrecBook')} (${ub.length})</div></div><div class="kpi" style="border-color:var(--amber)"><div class="v">${fmt(sumS)}</div><div class="l">${t('unrecStmt')} (${us.length})</div></div><div class="kpi" style="border-color:${diff==null?'var(--line)':Math.abs(diff)<0.5?'var(--green)':'var(--accent)'}"><div class="v">${diff==null?'—':fmt(diff)}</div><div class="l">${t('diffL')}</div></div></div>
 <div class="row"><button class="btn primary" onclick="autoMatch()">${t('autoMatch')}</button><button class="btn green" ${recSel.book&&recSel.stmt?'':'disabled'} onclick="doMatch()">${t('match')}</button><label class="row" style="align-items:center;gap:6px"><input type="checkbox" ${recShowMatched?'checked':''} onchange="recShowMatched=this.checked;render()"> ${t('showMatched')}</label><span class="muted">${t('recHint')}</span></div>
 <div class="two"><div class="panel"><h2>${t('bookSide')} · ${t('unmatched')} ${ub.length}</h2><table><tr><th>${t('date')}</th><th>${t('memo')}</th><th style="text-align:end">${t('amount')}</th></tr>${(recShowMatched?books:ub).map(b=>row(b.date,b.memo+(matchedIds.has(b.jid)?' ✓':''),b.amt,recSel.book===b.jid?'sel':'',matchedIds.has(b.jid)?'':`recSel.book=recSel.book==='${b.jid}'?null:'${b.jid}';render()`)).join('')||`<tr><td colspan=3 class="muted">${t('noData')}</td></tr>`}</table></div>
 <div class="panel"><h2>${t('stmtSide')} · ${t('unmatched')} ${us.length}</h2><table><tr><th>${t('date')}</th><th>${t('descr')}</th><th style="text-align:end">${t('amount')}</th><th></th></tr>${(recShowMatched?stmt:us).map(l=>row(l.date,l.desc+(l.match?' ✓ '+l.match:''),l.amt,recSel.stmt===l.id?'sel':'',l.match?'':`recSel.stmt=recSel.stmt==='${l.id}'?null:'${l.id}';render()`,`<td style="white-space:nowrap">${l.match?`<button class="btn sm ghost" onclick="event.stopPropagation();unmatchLine('${l.id}')">${t('unmatch')}</button>`:l.amt<0?`<button class="btn sm" onclick="event.stopPropagation();openExpense({date:'${l.date}',amount:${Math.abs(l.amt)},memo:'${esc(l.desc).replace(/'/g,'')}',from:'1010',lineId:'${l.id}'})">${t('addAsExpense')}</button>`:`<button class="btn sm" onclick="event.stopPropagation();openJE({date:'${l.date}',memo:'${esc(l.desc).replace(/'/g,'')}',lines:[{acct:'1010',dr:${l.amt},cr:0},{acct:'4030',dr:0,cr:${l.amt}}],lineId:'${l.id}'})">${t('addAsJE')}</button>`}${l.match?'':`<button class="btn sm ghost" onclick="event.stopPropagation();removeLine('${l.id}')">×</button>`}</td>`)).join('')||`<tr><td colspan=4 class="muted">${t('noData')}</td></tr>`}</table></div></div>`};

 <div class="row" style="margin-top:12px"><input id="na_code" placeholder="6070" style="width:100px"><input id="na_name" placeholder="Account name" style="width:260px"><select id="na_type" style="width:auto">${['asset','liability','equity','income','expense'].map(x=>`<option value="${x}">${I18N[lang].atype[x]}</option>`).join('')}</select><button class="btn sm" onclick="const c=document.getElementById('na_code').value.trim();if(!c||S.accounts.find(a=>a.code===c))return toast('Code exists');S.accounts.push({code:c,name:document.getElementById('na_name').value,type:document.getElementById('na_type').value});S.accounts.sort((a,b)=>a.code<b.code?-1:1);persist();render()">+ ${t('account')}</button></div></div>`};

let PO=null;
function openPO(id,preset){if(!S.stock.length)return toast(t('noStock'));if(!S.suppliers.length)return toast(t('noSup'));PO=id?JSON.parse(JSON.stringify(S.pos.find(x=>x.id===id))):(preset||{id:'PO-'+S.seq.po,date:today(),supplier:S.suppliers[0].id,status:'Draft',expected:addDays(today(),7),lines:[{item:S.stock[0].id,qty:1,cost:S.stock[0].cost}],note:'',_new:true});renderPO()}

function poForLow(){const low=S.stock.filter(x=>x.qty<=x.reorder);if(!low.length)return toast(t('noData'));const bySup={};if(!S.suppliers.length)return toast(t('noSup'));low.forEach(x=>{const sp=S.suppliers.find(y=>y.name===x.supplier)||S.suppliers[0];(bySup[sp.id]=bySup[sp.id]||[]).push({item:x.id,qty:Math.max(1,x.reorder*2-x.qty),cost:x.cost})});

 ${S.customers.map(c=>{const js=S.jobs.filter(j=>j.cust===c.id);const bal=S.invoices.filter(i=>i.cust===c.id).reduce((a,i)=>a+invBal(i),0);return `<tr><td><b>${c.name}</b></td><td>${c.company}</td><td>${c.phone}</td><td>${c.email||''}</td><td class="muted">${c.address||''}</td><td>${srcName(c.source)}</td><td>${js.length}</td><td>${fmt(js.reduce((a,j)=>a+jobQuoteTotal(j),0))}</td><td style="${bal>0.5?'color:var(--accent);font-weight:700':''}">${fmt(bal)}</td><td class="row"><button class="btn sm" onclick="openCustomer('${c.id}')">✎</button><a class="btn sm ghost" target="_blank" href="https://wa.me/${(c.phone||'').replace(/\D/g,'')}">WA</a></td></tr>`}).join('')}</table></div>
 <div class="panel"><h2>${t('suppliersT')}</h2><table><tr><th>${t('name')}</th><th>${t('contact')}</th><th>${t('phone')}</th><th>${t('email')}</th><th>${t('address')}</th><th>${t('ap')}</th><th></th></tr>
 ${S.suppliers.map(sp=>{const bal=S.bills.filter(b=>b.supplier===sp.id).reduce((a,b)=>a+billBal(b),0);return `<tr><td><b>${sp.name}</b></td><td>${sp.contact||''}</td><td>${sp.phone||''}</td><td>${sp.email||''}</td><td class="muted">${sp.address||''}</td><td style="${bal>0.5?'color:var(--amber);font-weight:700':''}">${fmt(bal)}</td><td><button class="btn sm" onclick="openSupplier('${sp.id}')">✎</button></td></tr>`}).join('')}</table></div>`;
function openCustomer(id){const c=id?S.customers.find(x=>x.id===id):{name:'',company:'',phone:'',email:'',address:'',source:'WhatsApp'};
 modal(`<h2>${id?t('editCustomer'):t('newCustomer')}</h2><div class="grid2"><label>${t('name')}<input id="c_n" value="${esc(c.name)}"></label><label>${t('company')}<input id="c_c" value="${esc(c.company)}"></label><label>${t('phone')}<input id="c_p" value="${esc(c.phone)}"></label><label>${t('email')}<input id="c_e" value="${esc(c.email||'')}"></label><label>${t('source')}<select id="c_s">${SOURCES.map(x=>`<option value="${x}" ${c.source===x?'selected':''}>${srcName(x)}</option>`).join('')}</select></label></div><label>${t('address')}<input id="c_a" value="${esc(c.address||'')}"></label>
 <div class="row"><button class="btn primary" onclick="const v=k=>document.getElementById(k).value;const o={name:v('c_n'),company:v('c_c')||'—',phone:v('c_p'),email:v('c_e'),address:v('c_a'),source:v('c_s')};if('${id||''}')Object.assign(S.customers.find(x=>x.id==='${id||''}'),o);else S.customers.push({id:'c'+uid(),...o});persist();closeModal();render();toast('✓')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button>${id&&!S.jobs.find(j=>j.cust===id)&&!S.enquiries.find(e=>e.cust===id)?`<button class="btn ghost right" onclick="S.customers=S.customers.filter(x=>x.id!=='${id}');persist();closeModal();render()">${t('delete')}</button>`:''}</div>`)}
function openSupplier(id){const sp=id?S.suppliers.find(x=>x.id===id):{name:'',contact:'',phone:'',email:'',address:''};
 modal(`<h2>${id?sp.name:t('newSupplier')}</h2><div class="grid2"><label>${t('name')}<input id="sp_n" value="${esc(sp.name)}"></label><label>${t('contact')}<input id="sp_c" value="${esc(sp.contact||'')}"></label><label>${t('phone')}<input id="sp_p" value="${esc(sp.phone||'')}"></label><label>${t('email')}<input id="sp_e" value="${esc(sp.email||'')}"></label></div><label>${t('address')}<input id="sp_a" value="${esc(sp.address||'')}"></label>
 <div class="row"><button class="btn primary" onclick="const v=k=>document.getElementById(k).value;const o={name:v('sp_n'),contact:v('sp_c'),phone:v('sp_p'),email:v('sp_e'),address:v('sp_a')};if('${id||''}')Object.assign(S.suppliers.find(x=>x.id==='${id||''}'),o);else S.suppliers.push({id:'sp'+uid(),...o});persist();closeModal();render();toast('✓')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>`)}

// ---------------------------------------------------------------- settings
VIEWS.settings=()=>`<div class="topbar"><h1>${t('settings')}</h1><div class="row"><button class="btn ghost" onclick="exportAll()">${t('exportAll')}</button><button class="btn ghost" onclick="DB.exportJSON()">${t('backup')}</button></div></div>
 ${DB.role==='owner'?`<div class="panel" id="staffpanel"><h2>${t('staffT')}</h2><p class="muted">${t('inviteNote')}</p><div id="stafflist">…</div></div><div class="panel"><div class="row"><h2>${t('serverBackups')}</h2><button class="btn sm right" onclick="backupNow()">${t('backupNow')}</button></div><div id="backuplist">…</div></div>`:''}
 <div class="two"><div class="panel"><h2>${t('companyName')}</h2><div class="grid2">
  <label>${t('companyName')}<input value="${esc(S.settings.company)}" onchange="S.settings.company=this.value;persist()"></label><label>C.R.<input value="${esc(S.settings.cr)}" onchange="S.settings.cr=this.value;persist()"></label>
  <label>${t('phone')}<input value="${esc(S.settings.phone)}" onchange="S.settings.phone=this.value;persist()"></label><label>${t('vatRate')}<input type="number" value="${S.settings.vat}" onchange="S.settings.vat=+this.value;persist()"></label>
  <label>${t('labourRate')}<input type="number" value="${S.settings.labour}" onchange="S.settings.labour=+this.value;persist()"></label>
  <label>${t('companyName')} (AR)<input value="${esc(S.settings.companyAr||'')}" onchange="S.settings.companyAr=this.value;persist()"></label><label>${t('email')}<input value="${esc(S.settings.email||'')}" onchange="S.settings.email=this.value;persist()"></label><label>${t('address')}<input value="${esc(S.settings.address||'')}" onchange="S.settings.address=this.value;persist()"></label>
  <label>${t('logo')}<input type="file" accept="image/*" onchange="const f=this.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.settings.logo=r.result;persist();render()};r.readAsDataURL(f)"></label>${S.settings.logo?`<div class="row"><img src="${S.settings.logo}" style="height:56px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px"><button class="btn sm ghost" onclick="S.settings.logo='';persist();render()">×</button></div>`:''}</div>
  <label style="margin-top:12px">${t('bank')}<textarea onchange="S.settings.bank=this.value;persist()">${esc(S.settings.bank||'')}</textarea></label><label style="margin-top:12px">${t('terms')}<textarea onchange="S.settings.terms=this.value;persist()">${esc(S.settings.terms||'')}</textarea></label>
  <h2 style="margin-top:18px">${t('machines')}</h2><div class="grid2">${Object.keys(S.machines).map(m=>`<label>${m} (QAR/h)<input type="number" value="${S.machines[m]}" onchange="S.machines['${m}']=+this.value;persist()"></label>`).join('')}</div></div>
 <div class="panel"><h2>${t('materials')}</h2><table><tr><th>${t('material')}</th><th>${t('unit')}</th><th>${t('ratePer')}</th><th>${t('machine')}</th><th></th></tr>
  ${S.materials.map((m,i)=>`<tr><td><input value="${esc(m.name)}" onchange="S.materials[${i}].name=this.value;persist()"></td><td><select onchange="S.materials[${i}].unit=this.value;persist()">${['sqm','piece','hour','lm'].map(u=>`<option ${m.unit===u?'selected':''}>${u}</option>`).join('')}</select></td><td><input type="number" value="${m.rate}" onchange="S.materials[${i}].rate=+this.value;persist()"></td><td><select onchange="S.materials[${i}].machine=this.value;persist()">${Object.keys(S.machines).map(x=>`<option ${m.machine===x?'selected':''}>${x}</option>`).join('')}</select></td><td><button class="btn sm ghost" onclick="S.materials.splice(${i},1);persist();render()">×</button></td></tr>`).join('')}</table>
  <button class="btn sm" style="margin-top:10px" onclick="S.materials.push({id:'m'+uid(),name:'New material',unit:'sqm',rate:100,machine:'Digital print'});persist();render()">+ ${t('addMat')}</button></div></div>`;

// ---------------------------------------------------------------- export (Excel / CSV)
let XL=null;function loadXLSX(){return XL?Promise.resolve(XL):new Promise((res,rej)=>{if(window.XLSX){XL=window.XLSX;return res(XL)}const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>{XL=window.XLSX;res(XL)};sc.onerror=()=>rej(new Error('xlsx'));document.head.appendChild(sc)})}
const cellVal=v=>{const sv=String(v??'').trim();const n=sv.replace(/^QAR\s*/,'').replace(/,/g,'').replace(/^−/,'-');return sv&&/^(QAR\s*)?-?[\d,]+(\.\d+)?$/.test(sv.replace(/^−/,'-'))&&!/^0\d/.test(n)?+n:sv};
function tableToAoA(tb){return [...tb.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>{const inp=td.querySelector('input,select');if(inp)return inp.type==='checkbox'?(inp.checked?'yes':'no'):(inp.tagName==='SELECT'?inp.options[inp.selectedIndex]?.text:inp.value);return cellVal(td.innerText.replace(/\s+/g,' '))}))}
function sheetName(wb,title){title=(title||'Sheet').replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,28)||'Sheet';let n=title,k=2;while(wb.SheetNames.includes(n))n=title.slice(0,25)+' '+(k++);return n}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function aoaCSV(aoas){return '﻿'+aoas.map(([title,rows])=>title+'\n'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n')).join('\n\n')}
async function exportSheets(aoas,file){try{const X=await loadXLSX();const wb=X.utils.book_new();aoas.forEach(([title,rows])=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows),sheetName(wb,title)));X.writeFile(wb,file+'.xlsx')}catch(e){dl(new Blob([aoaCSV(aoas)],{type:'text/csv;charset=utf-8'}),file+'.csv')}}
function exportScreen(){const tbs=[...document.querySelectorAll('#main table')].filter(tb=>tb.querySelectorAll('tr').length>1);if(!tbs.length)return toast(t('noData'));exportSheets(tbs.map((tb,k)=>[tb.closest('.panel')?.querySelector('h2,h3')?.innerText||`${t(view)} ${k+1}`,tableToAoA(tb)]),`alraghda-${view}-${today()}`)}
function exportAll(){const C=id=>cust(id).company||cust(id).name;const sh=[];
 sh.push(['Customers',[['ID','Name','Company','Phone','Email','Address','Source'],...S.customers.map(c=>[c.id,c.name,c.company,c.phone,c.email||'',c.address||'',c.source||''])]]);
 sh.push(['Suppliers',[['ID','Name','Contact','Phone','Email','Address'],...S.suppliers.map(x=>[x.id,x.name,x.contact||'',x.phone||'',x.email||'',x.address||''])]]);
 sh.push(['Materials',[['ID','Name','Unit','Rate','Machine'],...S.materials.map(m=>[m.id,m.name,m.unit,m.rate,m.machine])]]);
 sh.push(['Enquiries',[['ID','Date','Customer','Need','Source','Deadline','Status'],...S.enquiries.map(e=>[e.id,e.date,C(e.cust),e.need,e.source,e.deadline,e.status])]]);
 sh.push(['Quotes',[['Quote','Date','Customer','Title','Status','Subtotal','Discount','VAT','Total'],...S.quotes.map(q=>{const tt=quoteTotals(q);return [q.id,q.date,C(q.cust),q.title,q.status,tt.sub,tt.disc,tt.vat,tt.total]})]]);
 sh.push(['Quote lines',[['Quote','Material','Description','W','H','Qty','Line total'],...S.quotes.flatMap(q=>q.lines.map(l=>[q.id,mat(l.mat).name,l.desc||'',l.w||'',l.h||'',l.qty,lineTotal(l)]))]]);
 sh.push(['Jobs',[['Job','Quote','Customer','Title','Stage','Due','Machine','Assigned','Quoted','Materials cost','Machine hrs','Labour hrs','Actual cost','Margin'],...S.jobs.map(j=>{const q=jobQuoteTotal(j),c=jobCost(j);return [j.id,j.quote||'',C(j.cust),j.title,j.stage,j.due,j.machine,j.assigned||'',q,j.mat||0,j.machineHrs||0,j.labourHrs||0,c,q-c]})]]);
 sh.push(['Invoices',[['Invoice','Date','Customer','Job','Total','Paid','Credited','Balance','Status'],...S.invoices.map(i=>[i.id,i.date,C(i.cust),i.job,invTotal(i),invPaid(i),invCredit(i),invBal(i),invStatus(i)])]]);
 sh.push(['Receipts',[['Receipt','Date','Invoice','Customer','Method','Amount'],...S.invoices.flatMap(i=>i.payments.map(p=>[p.rcp||'',p.date,i.id,C(i.cust),p.method,+p.amount]))]]);
 sh.push(['Credit notes',[['Credit note','Date','Invoice','Customer','Reason','Amount'],...S.invoices.flatMap(i=>(i.credits||[]).map(c=>[c.cn,c.date,i.id,C(i.cust),c.reason||'',+c.amount]))]]);
 sh.push(['Bills',[['Bill','Supplier ref','Date','Due','Supplier','Account','Memo','Amount','VAT','Total','Paid','Balance'],...S.bills.map(b=>[b.id,b.ref||'',b.date,b.due,supplier(b.supplier).name,b.lines.map(l=>l.acct).join(' '),b.lines.map(l=>l.desc).join('; '),b.lines.reduce((a,l)=>a+ +l.amount,0),+b.vat||0,billTotal(b),billPaid(b),billBal(b)])]]);
 sh.push(['Bill payments',[['Bill','Date','Supplier','Method','Amount'],...S.bills.flatMap(b=>b.payments.map(p=>[b.id,p.date,supplier(b.supplier).name,p.method,+p.amount]))]]);
 sh.push(['Expenses',[['Ref','Date','Account','Memo','Paid from','Amount'],...S.expenses.map(e=>[e.id,e.date,acct(e.acct).name,e.desc,acct(e.from).name,+e.amount])]]);
 sh.push(['Stock',[['ID','Item','Unit','On hand','Reorder at','Unit cost','Value','Supplier'],...S.stock.map(x=>[x.id,x.name,x.unit,x.qty,x.reorder,x.cost,x.qty*x.cost,x.supplier||''])]]);
 sh.push(['Stock movements',[['ID','Date','Item','Type','Qty','Ref','Note'],...S.movements.map(v=>[v.id,v.date,stockItem(v.item).name,v.type,v.qty,v.ref||'',v.note||''])]]);
 sh.push(['Purchase orders',[['PO','Date','Supplier','Status','Expected','Item','Qty','Unit cost','Line total'],...S.pos.flatMap(po=>po.lines.map(l=>[po.id,po.date,supplier(po.supplier).name,po.status,po.expected,stockItem(l.item).name,l.qty,l.cost,l.qty*l.cost]))]]);
 sh.push(['Journal',[['Date','Ref','Source','Memo','Account','Account name','Debit','Credit'],...allJournals().flatMap(j=>j.lines.map(l=>[j.date,j.ref,j.src||'opening',j.memo,l.acct,acct(l.acct).name,+l.dr||0,+l.cr||0]))]]);
 const cb=balances(null,today());sh.push(['Trial balance',[['Code','Account','Type','Debit','Credit'],...S.accounts.filter(a=>(cb[a.code]||0)!==0).map(a=>{const v=cb[a.code]||0;return [a.code,a.name,a.type,v>0?v:0,v<0?-v:0]})]]);
 sh.push(['Chart of accounts',[['Code','Account','Type'],...S.accounts.map(a=>[a.code,a.name,a.type])]]);
 exportSheets(sh,`alraghda-all-data-${today()}`)}
// ---------------------------------------------------------------- utils
function modal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modalbg').classList.add('open')}
function closeModal(){document.getElementById('modalbg').classList.remove('open')}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
DB.init(()=>render());
</script>
